<html>
    <head>
        <title>0921-CSS簡介</title>
        <!-- hTML註解-->
        <style> /* CSS註解 */
        /* CSS又稱樣式表*/
        /*選擇器:selecter 有三種 標籤名稱 #id .class*/
        /*display:block/inline-block
        width:px pixal像素
        height:px;

        color:前景顏色
        background-color:背景顏色
        
        顏色的設定方法
        1.英文單字
        2.rgb(0~225,0~225,0~225)
        3.rgba(紅光0~225,綠光0~225,藍光0~225,可見度0~1) //0全透明~1不透明
        4.色碼 #RRGGBB 00~FF
        5.hsl(色相0~360,彩度0~100%,亮度0~100%)
        6.hsla(色相0~360,彩度0~100%,亮度0~100%,可見度0~1) //0全透明~1不透明
        */
            P{
                background-color: gray;
            }
            #p1{
                background-color: aqua;
            }
            .c1{
                color: red;
            }
            #d1{
                background-color: hsl(240, 70%, 50%);
                height: 500px;
                width: 500px;
            }
        </style>
    </head>
    <body>
        <p id="p1" class="c1">第一個段落<br>123</p>
        <p style="color:blue">第二個段落</p>
        <p class="c1";">第三個段落</p>
        <div id="d1" class="dc1"></div>
        <div class="dc1"></div>
    </body>
</html>
