<html>
<head><!--網頁設定-->
	<title>0907-HTML標籤簡介1</title>

</head>
<body><!--網頁內容-->
	<p>中文<br>中文</p>
	<p>nbsp&nbsp;&nbsp;&nbsp;空白non-break space</p>
	<p>ensp&ensp;&ensp;&ensp;空白(半形)</p>
	<p>emsp&emsp;&emsp;&emsp;空白(全形)</p>
	<p>格式標籤:<b>粗體</b> <i>斜體</i> <u>底線</u> <s>刪除線</s> </p>
	<p>語意標籤:<strong>重要</strong> <em>強調</em> <ins>插入</ins> <del>刪除</del> <sub>下標</sub> <sup>上標</sup> <mark>標記</mark></p>
	<p>列表<br>
	無序列表 unordered-list(項目符號):
	<ul type="square">
		<li>項目</li><!--list item-->
		<li>項目</li><!--list item-->
		<li>項目</li><!--list item-->
		<li>項目</li><!--list item-->
	</ul>
	有序列表ordered-list:
	<ol type="i" start="3">
		<li>項目</li><!--list item-->
		<li>項目</li><!--list item-->
		<li>項目</li><!--list item-->
		<li>項目</li><!--list item-->
	
	</ol>
	<pre>預格式    
	的文字</pre>
	</p>


</body>
